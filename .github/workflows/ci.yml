
name: StockPilot AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://127.0.0.1:3306/stockpilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: stockuser
      DB_PASSWORD: stockpassword
      JWT_SECRET: ci-only-test-secret-change-before-deployment-0123456789abcdef

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: stockpilot
          MYSQL_USER: stockuser
          MYSQL_PASSWORD: stockpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests (Unit, Security, Invariants, PO Lifecycle, Calculations)
        working-directory: ./backend
        run: mvn clean test

      - name: Build Backend Artifact
        working-directory: ./backend
        run: mvn package -DskipTests

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Check & Production Build
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Container Images Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t stockpilot-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t stockpilot-frontend:ci ./frontend
