spring:
  application:
    name: stockpilot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

---
# Development Profile (H2 In-Memory Fallback if MySQL unavailable)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:

---
# Production Profile (MySQL Primary)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stockpilot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    properties:
      hibernate:

# Custom Application Properties
stockpilot:
  analytics:
    risk:
      low-days: 30
      medium-days: 14
      high-days: 6
    reorder:
      safety-factor: 1.5
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000 # 24 Hours
      refresh-expiration-ms: 604800000 # 7 Days
  ai:
    provider: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:mock-key-disabled}
    model: ${AI_MODEL:gpt-4o-mini}
    enabled: ${AI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
